[project]
name = "geochange-analyzer-backend"
version = "0.1.0"
description = "GeoLens Analyzer API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "geoalchemy2>=0.15.0",
    "alembic>=1.14.0",
    "shapely>=2.0.0",
    "numpy>=2.0.0",
    "rasterio>=1.4.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
